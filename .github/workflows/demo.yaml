name: Deploy budget notebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # marimo needs uv installed to bundle local modules (setup.py,
      # transactions.py, budget.py, seed_data.py) into the WASM export.
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install marimo
        run: uv tool install "marimo[sandbox]"

      - name: Export notebook to WebAssembly HTML
        run: |
          uv tool run marimo export html-wasm scripts/main.py -o dist --mode run

      # Prevent GitHub Pages from running Jekyll over the export (it would
      # otherwise ignore files/folders starting with an underscore).
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4